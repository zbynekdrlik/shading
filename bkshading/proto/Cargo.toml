[package]
name = "bkshading-proto"
version.workspace = true
edition = "2021"
authors = ["zbynekdrlik"]
description = "Shared wire types + the Blackmagic camera REST mapping for bkshading (issue 808, shading#6)"
license = "MIT"
repository = "https://github.com/zbynekdrlik/shading"

[lib]
name = "bkshading_proto"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

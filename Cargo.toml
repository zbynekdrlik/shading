# shading workspace: the bkshading shading-control service, the camera relay, their shared
# protocol and the operator panel (Leptos CSR, built to WASM by Trunk, shading#16). Imported
# from camera-box (shading#1); camera-box now pins a release.
[workspace]
members = ["bkshading/proto", "bkshading/relay", "bkshading/service", "bkshading/panel"]
resolver = "2"

# Single source of truth for the version of all four crates (CARGO_PKG_VERSION).
# `bkshading-relay --version` prints it as its last word: a pinned contract (docs/CONTRACT.md).
[workspace.package]
version = "0.2.12"

[profile.release]
lto = true
codegen-units = 1
strip = true

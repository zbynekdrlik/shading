# shading workspace: the bkshading shading-control service, the camera relay and their
# shared protocol. Imported from camera-box (shading#1); camera-box now pins a release.
[workspace]
members = ["bkshading/proto", "bkshading/relay", "bkshading/service"]
resolver = "2"

# Single source of truth for the version of all three crates (CARGO_PKG_VERSION).
# `bkshading-relay --version` prints it as its last word: a pinned contract (docs/CONTRACT.md).
[workspace.package]
version = "0.1.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
